<!-- <h1> {{ title }}</h1>
<p>{{ role === 'admin' ? '管理員' : '一般使用者'}}</p> -->
<div class="container mt-4">
  <div class="card p-3">
    <label>帳號: </label>
    <input [(ngModel)]="inputUser.inputAccount" [placeholder]="accountPlaceHolder" type="text" class="form-control mb-3">
    <br>
    <label>密碼: </label>
    <input [(ngModel)]="inputUser.inputPwd" [placeholder]="passwordPlaceHolder" type="password" class="form-control mb-3">
    <br>
    <button (click)="submit($event)" class="btn btn-primary">送出</button>
  </div>

  <div class="container mt-4">
    <p>id: {{ inputUser.inputAccount }}
    <br>pwd: {{ inputUser.inputPwd }}</p>
  </div>
</div>
