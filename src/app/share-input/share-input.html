<div>
<label>帳號: </label>
  <input [(ngModel)]="account" [placeholder]="accountPlaceHolder" type="text">
  <br>
  <label>密碼: </label>
  <input [(ngModel)]="password" [placeholder]="passwordPlaceHolder" type="password">
  <br>
  <button (click)="submit()">send</button>
</div>

<div>
  <p>id: {{ account }}
  <br>pwd: {{ password }}</p>
</div>
