<h3>{{title}}</h3>

<app-practice-input [user_son]="user" (submitEmitter)="submit($event)"></app-practice-input>

<br>

<table>
  <tr>
    <th>帳號</th>
    <th>密碼</th>
  </tr>
  <tr>
    <td>{{showUser.account}}</td>
    <td>{{showUser.password}}</td>
  </tr>
</table>

@if(isDuplicate)
{
<p [ngClass]="{'Red':true}">有重複帳號</p>
}
<table>
  <tr>
    <th>帳號清單</th>
    <th>密碼清單</th>
  </tr>
  @for ( user of showUserList ; track $index)
  {
  <tr>
    <td>{{user.account}}</td>
    <td>{{user.password}}</td>
  </tr>
  }
</table>
