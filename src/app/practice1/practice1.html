<h3>{{title}}</h3>
<div>
  <p>帳號 :</p>
  <input [disabled]="isDisable" [(ngModel)]="user.account">
  @if(!user.account)
  {
  <p [ngClass]="{'Red':true}">請輸入帳號</p>
  }
  <br>
  <p>密碼 :</p>
  <input [(ngModel)]="user.password">
  @if(!user.password)
  {
  <p [ngClass]="{'Red':true}">請輸入密碼</p>
  }
  <br>
  <br>
  <button (click)="submit()">送出</button>
  <button (click)="clear()">清除</button>
  <button (click)="switch()">切換</button>
</div>

<br>

<table>
  <tr>
    <th>帳號</th>
    <th>密碼</th>
  </tr>
  <tr>
    <td>{{showUser.account}}</td>
    <td>{{showUser.password}}</td>
  </tr>
</table>

@if(isDuplicate)
{
<p [ngClass]="{'Red':true}">有重複帳號</p>
}
<table>
  <tr>
    <th>帳號清單</th>
    <th>密碼清單</th>
  </tr>
  @for ( user of showUserList ; track $index)
  {
  <tr>
    <td>{{user.account}}</td>
    <td>{{user.password}}</td>
  </tr>
  }
</table>
